name: Nightly build

# 00:00 UTC, if main has changed since the last nightly: <version>-nightly.<build>.
# By hand at any time, changed or not.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  version:
    name: Version
    if: github.repository == 'DashyNMS/mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version
        id: version
        run: python3 scripts/build_version.py nightly --notes artifacts/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: artifacts/notes.md
          if-no-files-found: error
          retention-days: 14

  ci:
    name: CI
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # for the image job, which only pull requests run

  binaries:
    name: Standalone binaries
    needs: [version, ci]
    uses: ./.github/workflows/binaries.yml
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    with:
      version: ${{ needs.version.outputs.version }}
      sign: true

  # Published only once every binary has built and passed.
  image:
    name: Container image
    needs: [version, ci, binaries]
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}
      channel: nightly

  shared:
    name: Shared package
    needs: [version, image]
    uses: ./.github/workflows/shared-package.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs: [version, shared]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its files
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-binaries
          path: packed
      - name: Check the bytes
        working-directory: packed
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packed/dashynms-mcp-*
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: gh release create "$TAG" packed/* --target "$COMMIT" --title "$VERSION" --notes-file notes.md --prerelease --latest=false
