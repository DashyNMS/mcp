name: Shared package checks

# Builds and tests the solution, packs DashyNMS.Agent.Shared and checks the
# package, without publishing it. CI's main build and test, and the first half
# of shared-package.yml.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      artifact:
        description: What to call the package's artifact, which is unique in a run
        type: string
        default: shared-package
    outputs:
      sha256:
        description: The verified package's hash
        value: ${{ jobs.verify.outputs.sha256 }}

permissions:
  contents: read
  packages: read

env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SHARED_VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The binary compatibility fixture compiles against a pinned pre-move revision.
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build and test solution
        run: |
          dotnet build DashyNMS.Mcp.slnx -c Release -warnaserror -p:SharedBuildVersion="$SHARED_VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true
          dotnet test DashyNMS.Mcp.slnx -c Release --no-build
      - name: Run a previously compiled Agent consumer with current assemblies
        run: python3 scripts/verify-agent-binary-compatibility.py
      - name: Pack the Shared package with source provenance
        run: >-
          dotnet pack src/DashyNMS.Agent.Shared -c Release --no-build --no-restore -o artifacts
          -p:SharedBuildVersion="$SHARED_VERSION"
          -p:RepositoryCommit="$GITHUB_SHA"
          -p:SourceRevisionId="$GITHUB_SHA"
          -p:ContinuousIntegrationBuild=true
      - name: Inspect package and restore a clean Shared-only consumer
        run: python3 scripts/verify-shared-package.py
      - name: Recheck provenance hash
        run: python3 scripts/verify-shared-provenance.py
      # Later jobs compare downloads with this job output rather than trusting
      # the report that travels inside the same artefact.
      - name: Record the verified package hash
        id: hash
        run: echo "sha256=$(sha256sum "artifacts/DashyNMS.Agent.Shared.$SHARED_VERSION.nupkg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: artifacts/
          if-no-files-found: error

  core-compatibility:
    name: Core compatibility (${{ matrix.consumer }}, ${{ matrix.core }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MCP's own pin (Directory.Build.props), which mobile moves to before it
          # pins this Shared: it's on 2.0.0-ci.76, and Shared needs ci.84 or later.
          - consumer: mcp and mobile
            core: 2.0.0-edge.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: artifacts
      - name: Build the Shared package from source against this Core
        run: dotnet build src/DashyNMS.Agent.Shared -c Release -warnaserror -p:DashyNMSCoreVersion=${{ matrix.core }}
      - name: Test the packed Shared binary with this Core
        env:
          EXPECTED_SHARED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: python3 scripts/verify-shared-core-compatibility.py ${{ matrix.core }}
