name: Release build

# Publishing a GitHub release (tag v<version>, on main's newest commit) builds
# it. The release goes back to being a draft while that happens, and is
# published again when everything in it is ready. If a build fails it stays a
# draft: fix it, then run this by hand with the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (vX.Y.Z)"
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: release-build-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  hold:
    name: Hold the release
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'DashyNMS/mcp'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Make it a draft and build it from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" --draft
          gh workflow run release-build.yml --ref main -f tag="$TAG"

  version:
    name: Version
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'DashyNMS/mcp'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/build_version.py release --tag "$TAG"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # for the image job, which only pull requests run

  binaries:
    name: Standalone binaries
    needs: [version, ci]
    uses: ./.github/workflows/binaries.yml
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    with:
      version: ${{ needs.version.outputs.version }}
      sign: true

  # Published only once every binary has built and passed.
  image:
    name: Container image
    needs: [version, ci, binaries]
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}
      channel: release

  shared:
    name: Shared package
    needs: [version, image]
    uses: ./.github/workflows/shared-package.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs: [version, shared]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its files
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-binaries
          path: packed
      - name: Check the bytes
        working-directory: packed
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packed/dashynms-mcp-*
      - name: Attach the binaries and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$TAG" packed/* --clobber
          gh release edit "$TAG" --draft=false --latest
