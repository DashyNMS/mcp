name: Shared package

# Checks DashyNMS.Agent.Shared and publishes it. Called by the edge, nightly
# and release builds. Mobile verifies that its package was attested by this
# file, so renaming it means changing SHARED_WORKFLOW there.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read
  packages: read

env:
  # A version names one set of bytes: GitHub Packages refuses a second push of
  # one, and the publish job never skips duplicates.
  SHARED_VERSION: ${{ inputs.version }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/shared-checks.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Publish
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'DashyNMS/mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-package
          path: artifacts
      # Expected source values come from this run's own context: the package
      # was produced earlier in the same run, never taken from another one.
      - name: Verify the exact package for publication
        env:
          EXPECTED_SOURCE_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_REF: ${{ github.ref }}
          EXPECTED_SOURCE_REF_PROTECTED: ${{ github.ref_protected }}
          EXPECTED_SOURCE_RUN_ID: ${{ github.run_id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHARED_SHA256: ${{ needs.checks.outputs.sha256 }}
        run: |
          python3 scripts/verify-shared-provenance.py --for-publication
          echo "$EXPECTED_SHARED_SHA256  artifacts/DashyNMS.Agent.Shared.$SHARED_VERSION.nupkg" | sha256sum --check --strict
      # A version is only ever one set of bytes. One that's already there is
      # accepted only if this workflow attested it from this commit: then an
      # earlier run published it and something after it failed.
      - name: Look for an earlier publish of this version
        id: earlier
        env:
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sSL -u "DashyNMS:$PULL_TOKEN" -o "$RUNNER_TEMP/published.nupkg" -w '%{http_code}' \
            "https://nuget.pkg.github.com/DashyNMS/download/dashynms.agent.shared/$SHARED_VERSION/dashynms.agent.shared.$SHARED_VERSION.nupkg")
          if [ "$status" = 200 ]; then
            gh attestation verify "$RUNNER_TEMP/published.nupkg" --repo DashyNMS/mcp \
              --signer-workflow DashyNMS/mcp/.github/workflows/shared-package.yml --source-digest "$GITHUB_SHA"
            echo "DashyNMS.Agent.Shared $SHARED_VERSION was already published from this commit" >> "$GITHUB_STEP_SUMMARY"
            echo "sha256=$(sha256sum "$RUNNER_TEMP/published.nupkg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" != 404 ]; then
            echo "::error::GitHub Packages answered $status when asked for $SHARED_VERSION."
            exit 1
          fi
      - name: Attest build provenance
        if: steps.earlier.outputs.published != 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/DashyNMS.Agent.Shared.${{ env.SHARED_VERSION }}.nupkg
      # No --skip-duplicate: an unexplained version must fail rather than be
      # reported as published with bytes this run did not produce.
      - name: Publish to GitHub Packages
        if: steps.earlier.outputs.published != 'true'
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "artifacts/DashyNMS.Agent.Shared.$SHARED_VERSION.nupkg"
          --source https://nuget.pkg.github.com/DashyNMS/index.json
          --api-key "$PUSH_TOKEN"
      - name: Confirm the feed serves the verified bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHARED_SHA256: ${{ steps.earlier.outputs.sha256 || needs.checks.outputs.sha256 }}
        run: python3 scripts/verify-published-shared.py
      - name: Summary
        if: steps.earlier.outputs.published != 'true'
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          echo "Attestation: $ATTESTATION_URL" >> "$GITHUB_STEP_SUMMARY"
