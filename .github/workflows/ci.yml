name: Build and test

on:
  push:
  pull_request:

# Read-only token: CI only checks out and builds. packages: read restores
# DashyNMS.Core from GitHub Packages (see nuget.config).
permissions:
  contents: read
  packages: read

env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build DashyNMS.Mcp.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test DashyNMS.Mcp.slnx -c Release --no-build
