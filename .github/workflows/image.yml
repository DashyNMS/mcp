name: Container image

# Builds the image and smoke-tests it, then publishes it when asked. Called by
# CI, and by the edge, nightly and release builds, which publish
# ghcr.io/dashynms/mcp as their version and as:
#   edge      edge and sha-<commit>
#   nightly   nightly
#   release   latest and <major>.<minor>
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        description: edge, nightly or release; blank builds without publishing
        type: string
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dashynms/mcp

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publishes the image; also reads DashyNMS.Core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=edge,enable=${{ inputs.channel == 'edge' }}
            type=sha,format=short,enable=${{ inputs.channel == 'edge' }}
            type=raw,value=nightly,enable=${{ inputs.channel == 'nightly' }}
            type=raw,value=latest,enable=${{ inputs.channel == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.channel == 'release' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=DashyNMS MCP
            org.opencontainers.image.description=Read-only MCP server for LibreNMS
            org.opencontainers.image.licenses=MIT
            net.dashynms.license.scope=MIT applies to DashyNMS project-owned material only; dependencies and base layers retain their own licences. See /app/NOTICES.md.
          annotations: |
            org.opencontainers.image.title=DashyNMS MCP
            org.opencontainers.image.description=Read-only MCP server for LibreNMS
            org.opencontainers.image.licenses=MIT
            net.dashynms.license.scope=MIT applies to DashyNMS project-owned material only; dependencies and base layers retain their own licences. See /app/NOTICES.md.

      # Build the runner's own architecture first and check it starts, so a
      # broken image never gets as far as the registry.
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ inputs.version }}
          platforms: linux/amd64
          load: true
          tags: dashynms-mcp:smoke
          secrets: |
            packages=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # With no settings the server must refuse to start, name what's missing
      # and exit with code 2 - proof the runtime, app and config check all work.
      - name: Smoke test
        run: |
          set +e
          output=$(docker run --rm dashynms-mcp:smoke 2>&1 </dev/null)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 2
          grep -q "LIBRENMS_URL is not set" <<<"$output"
          test "$(docker image inspect dashynms-mcp:smoke --format '{{.Config.User}}')" != ""

      # Over HTTP, against a stand-in LibreNMS on the runner: the probes answer
      # without a token, and nothing else does (DashyNMS/mcp#17).
      - name: HTTP smoke test
        run: |
          python3 - <<'PY' &
          import http.server, json
          class LibreNms(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = {'status': 'ok', 'system': [{'local_ver': '26.10.0'}]} if self.path == '/api/v0/system' \
                      else {'status': 'ok', 'devices': [{'device_id': 1, 'hostname': 'core-sw1.example.net', 'status': 1}]}
                  data = json.dumps(body).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)
              def log_message(self, *args):
                  pass
          http.server.ThreadingHTTPServer(('127.0.0.1', 18000), LibreNms).serve_forever()
          PY
          stub=$!
          token=$(openssl rand -hex 32)
          id=$(docker run -d --network host -e MCP_TRANSPORT=http -e MCP_HTTP_PORT=18080 -e "MCP_HTTP_TOKENS=smoke:$token" \
            -e LIBRENMS_URL=http://127.0.0.1:18000 -e LIBRENMS_TOKEN=synthetic dashynms-mcp:smoke)
          trap 'docker logs "$id"; docker rm -f "$id" >/dev/null; kill "$stub"' EXIT
          for _ in $(seq 30); do curl -sf http://127.0.0.1:18080/health >/dev/null && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:18080/health)" = ok
          test "$(curl -s http://127.0.0.1:18080/ready)" = ready

          post() {
            curl -s -o "$1" -D headers -w '%{http_code}' http://127.0.0.1:18080/mcp \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' "${@:3}" -d "$2"
          }
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'
          test "$(post refused "$init")" = 401
          test "$(post refused "$init" -H 'Authorization: Bearer wrong')" = 401
          test "$(post answer "$init" -H "Authorization: Bearer $token")" = 200
          grep -q '"name":"dashynms"' answer
          session=$(grep -i '^mcp-session-id:' headers | cut -d' ' -f2 | tr -d '\r')
          call='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"find_device","arguments":{"query":"core"}}}'
          test "$(post refused "$call" -H "Mcp-Session-Id: $session")" = 401
          test "$(post answer "$call" -H "Mcp-Session-Id: $session" -H "Authorization: Bearer $token")" = 200
          grep -q 'core-sw1.example.net' answer
          test "$(docker logs "$id" 2>&1 | grep -c '"event":"tool_call"')" -eq 1
          docker logs "$id" 2>&1 | grep -q '"token_label":"smoke"'
          if docker logs "$id" 2>&1 | grep -q "$token"; then echo "::error::The token is in the log."; exit 1; fi

      # The image must carry the project licence, the notices and the dependency
      # licence evidence collected at build time. Chiseled has no shell, so copy
      # the files out rather than running anything inside it.
      - name: Check bundled licence and notices
        run: |
          id=$(docker create dashynms-mcp:smoke)
          out=$(mktemp -d)
          docker cp "$id:/app/LICENSE" "$out/LICENSE"
          docker cp "$id:/app/NOTICES.md" "$out/NOTICES.md"
          docker cp "$id:/app/third-party" "$out/third-party"
          docker rm "$id"
          cmp LICENSE "$out/LICENSE"
          cmp NOTICES.md "$out/NOTICES.md"
          test -s "$out/third-party/inventory.json"
          test "$(docker image inspect dashynms-mcp:smoke --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = MIT

      - name: Sign in to GHCR
        if: inputs.channel != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ inputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.channel != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          secrets: |
            packages=${{ secrets.GITHUB_TOKEN }}
          sbom: true
