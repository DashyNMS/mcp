# Everything here is pinned (actions by commit SHA, base images by digest,
# packages by version), so nothing moves unless Dependabot proposes it. Minor
# and patch updates are grouped per ecosystem to keep the PR count down;
# majors come one at a time.
version: 2

# DashyNMS.Core comes from GitHub Packages, which needs a login. The token is
# a Dependabot secret (Settings > Secrets and variables > Dependabot):
# DASHYNMS_PACKAGES_TOKEN, a classic token with read:packages only.
registries:
  dashynms:
    type: nuget-feed
    url: https://nuget.pkg.github.com/DashyNMS/index.json
    username: dependabot
    password: ${{secrets.DASHYNMS_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  # Bumps the base images' digests when Microsoft ships patched images,
  # and their tags when a new .NET version comes out. Grouped by name rather
  # than update type: update-types only knows major/minor/patch, and a
  # digest-only bump is none of those. The SDK and runtime images must move
  # together anyway, majors included.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    registries:
      - dashynms
    ignore:
      # Pinned by hand to a development build of DashyNMS/core between
      # releases (see docs/DEVELOPMENT.md), not bumped on every merge there.
      - dependency-name: "DashyNMS.Core"
    schedule:
      interval: weekly
      day: monday
    groups:
      # Released together, so they're updated together.
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      packages:
        update-types: [minor, patch]

